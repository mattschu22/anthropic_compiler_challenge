<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="446" viewBox="0 0 1340 446">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="56" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Round Unrolling: Expose the Fixed Depth Sequence</text>
<text x="56" y="80" font-family="Arial, sans-serif" font-size="15" fill="#475569">16 rounds over a height-10 tree (depth = r % 11) compile to a constant, branch-free schedule</text>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker><marker id="arw" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/></marker></defs>
<text x="56" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#94a3b8">GENERIC LOOP · runtime checks</text>
<rect x="56" y="132" width="470" height="280" rx="11" fill="#ffffff" stroke="#e6eaf0" stroke-width="1.2"/>
<text x="84" y="184" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328" xml:space="preserve">for r in range(16):</text>
<text x="84" y="218" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328" xml:space="preserve">    depth = r % 11</text>
<rect x="394" y="204" width="116" height="20" rx="5" fill="#fee2e2"/>
<text x="452" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">runtime %</text>
<text x="84" y="252" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328" xml:space="preserve">    fp, ip, vp = header(mem)</text>
<rect x="394" y="238" width="116" height="20" rx="5" fill="#fee2e2"/>
<text x="452" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">layout load</text>
<text x="84" y="286" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328" xml:space="preserve">    if depth == 10:  reset</text>
<rect x="394" y="272" width="116" height="20" rx="5" fill="#fee2e2"/>
<text x="452" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">branch / round</text>
<text x="84" y="320" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328" xml:space="preserve">    else:            descend</text>
