<text x="72" y="382" font-family="Arial, sans-serif" font-size="12" fill="#64748b">repeated every round — work the compiler can do once</text>
<line x1="538" y1="272.0" x2="586" y2="272.0" stroke="#334155" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="564" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">unroll</text>
