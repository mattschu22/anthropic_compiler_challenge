<rect x="419" y="506" width="102" height="36" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<text x="470" y="521" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f2937">h = t*2</text>
<text x="470" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#7c3aed">VALU</text>
<text x="40" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Critical chain is 5 deep → 5-cycle floor.</text>
<text x="40" y="600" font-family="Arial, sans-serif" font-size="13" fill="#475569">RAW sets the floor; WAR/WAW constrain order. Stage 10 relaxes WAR (zero-latency).</text>
