<rect x="99" y="506" width="102" height="36" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
<text x="150" y="521" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f2937">sel child</text>
